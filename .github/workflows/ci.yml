name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Check
        run: cargo check --all-targets
      - name: Install real rust-analyzer and standard-library sources
        run: rustup component add rust-analyzer rust-src
      - name: Real rust-analyzer LSP integration (initialize / didOpen / definition)
        run: cargo test actual_rust_analyzer_resolves_definition -- --ignored --nocapture
