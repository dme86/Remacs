[package]
name = "remacs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tiny Rust terminal editor with Emacs-inspired keybindings"
repository = "https://github.com/dme86/Remacs"

[dependencies]
crossterm = "0.28"
unicode-width = "0.2"
two-face = { version = "0.5.2", features = ["syntect-default-onig"] }
mlua = { version = "0.11", features = ["lua54", "vendored"] }

# Function-aware visual text objects (on demand, not on each keystroke)
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
